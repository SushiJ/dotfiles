general.import = ["/home/sushi/.config/alacritty/tokyo.toml"]
general.live_config_reload = true

[cursor.style]
blinking = "Always"
shape = "Block"

[env]
TERM = "alacritty"

[font]
size = 14.0

[font.bold]
family = "TX-02"

[font.bold_italic]
family = "TX-02"

[font.italic]
family = "TX-02"

[font.normal]
family = "TX-02"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[terminal.shell]
program = "fish"

[window]
decorations = "full"
dynamic_title = true
opacity = 1
title = "Alacritty"

[window.padding]
x = 0
y = 2
